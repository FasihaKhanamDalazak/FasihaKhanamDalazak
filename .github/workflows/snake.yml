name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate blue snake
        uses: Platane/snk@v3
        with:
          github_user_name: FasihaKhanamDalazak
          outputs: |
            dist/github-snake-blue.svg?color_snake=%2338BDF8&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%23216E39
      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
